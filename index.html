<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fata AI - Injin Basira da Ilimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- MarkedJS don fassara Markdown da nuna hotuna da ke ciki -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --user-msg: #2563eb;
            --ai-msg: #334155;
            --text-color: #f8fafc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            margin-bottom: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--user-msg);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: var(--ai-msg);
            color: var(--text-color);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .message-bubble img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .input-area {
            background-color: var(--card-bg);
            padding: 15px;
            border-top: 1px solid #334155;
        }

        .btn-custom {
            background-color: #2563eb;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #1d4ed8;
            color: white;
        }

        audio {
            height: 30px;
            margin-top: 8px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-3 border-bottom border-secondary d-flex justify-content-between align-items-center bg-dark">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-robot text-primary fs-3"></i>
            <h4 class="m-0 fw-bold">Fata AI <span class="badge bg-primary fs-6">Ultra 2026</span></h4>
        </div>
        <div>
            <span class="badge bg-success p-2"><i class="bi bi-stars"></i> Yanayin All-in-One</span>
        </div>
    </header>

    <!-- Chat Box -->
    <div class="chat-container" id="chatContainer">
        <div class="d-flex ai-message message-bubble align-items-start gap-2">
            <div>
                <strong>Fata AI:</strong> Sannu! Ni ce Fata AI. Zan iya amsa tambayoyinka, gudanar da bincike a Google, kera maka hotuna, da kuma karanta amsoshi da murya a wuri guda. Me kake son mu gudanar yanzu?
            </div>
        </div>
    </div>

    <!-- Input Form -->
    <div class="input-area">
        <form id="chatForm" onsubmit="handleSubmit(event)">
            <div class="input-group">
                <input type="file" id="fileInput" class="d-none" accept="image/*,video/*,audio/*,.pdf,.txt" onchange="handleFileSelect()">
                <button type="button" class="btn btn-outline-secondary text-white" onclick="document.getElementById('fileInput').click()">
                    <i class="bi bi-paperclip"></i>
                </button>

                <input type="text" id="userInput" class="form-control bg-dark text-white border-secondary" placeholder="Amsa tambaya, nemi bincike, ko ka ce 'haɗa hoton...'" required>

                <button type="submit" class="btn btn-custom" id="sendBtn">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
            <small id="fileLabel" class="text-info mt-1 d-block" style="display: none !important;"></small>
        </form>
    </div>

    <script>
        const BASE_URL = "https://fata-ai-backend-9zxv.onrender.com";
        let selectedFile = null;

        function handleFileSelect() {
            const fileInput = document.getElementById('fileInput');
            const fileLabel = document.getElementById('fileLabel');
            if (fileInput.files.length > 0) {
                selectedFile = fileInput.files[0];
                fileLabel.innerText = "An zaɓi fayil: " + selectedFile.name;
                fileLabel.style.setProperty('display', 'block', 'important');
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const inputField = document.getElementById('userInput');
            const message = inputField.value.trim();
            if (!message && !selectedFile) return;

            // Nuna saƙon mai amfani
            appendMessage(message || (selectedFile ? selectedFile.name : ''), 'user');
            inputField.value = '';

            // Aika buƙata zuwa guda ɗaya kawai
            await streamChat(message);

            // Wanke fayil ɗin da aka zaɓa
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('fileLabel').style.setProperty('display', 'none', 'important');
        }

        function appendMessage(content, sender) {
            const chatContainer = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message-bubble ${sender === 'user' ? 'user-message' : 'ai-message'}`;
            msgDiv.innerHTML = sender === 'user' ? content : marked.parse(content);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        // HIRA DA KERA HOTO A WURI GUDA (UNIFIED STREAM)
        async function streamChat(message) {
            const formData = new FormData();
            formData.append('message', message);
            if (selectedFile) {
                formData.append('file', selectedFile);
            }

            const aiMsgDiv = appendMessage('<em>Fata AI tana tunani...</em>', 'ai');
            let fullText = '';

            try {
                const response = await fetch(`${BASE_URL}/api/v2/chat/stream`, {
                    method: 'POST',
                    body: formData
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                aiMsgDiv.innerHTML = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            if (dataStr === '[DONE]') break;

                            try {
                                const parsed = JSON.parse(dataStr);
                                if (parsed.content) {
                                    fullText += parsed.content;
                                    aiMsgDiv.innerHTML = marked.parse(fullText);
                                    document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }

                // Kara muryar sauti (TTS) idan ba hoton guda daya kacal aka turo ba
                if (fullText && !fullText.includes("![") && !fullText.includes("data:image")) {
                    addVoicePlayer(aiMsgDiv, fullText);
                }

            } catch (err) {
                aiMsgDiv.innerHTML = '<span class="text-danger">⚠️ Kuskure wajen sadarwa da backend.</span>';
            }
        }

        // SAURARON SAUTI DA MURYA (VOICE TTS)
        async function addVoicePlayer(container, text) {
            const formData = new FormData();
            formData.append('text', text.substring(0, 300));
            formData.append('lang', 'ha');

            try {
                const res = await fetch(`${BASE_URL}/api/v2/chat/text-to-speech`, {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    const blob = await res.blob();
                    const audioUrl = URL.createObjectURL(blob);
                    const audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = audioUrl;
                    container.appendChild(audio);
                }
            } catch (e) {
                console.log("Kuskuren sarrafa sauti:", e);
            }
        }
    </script>
</body>
</html>
