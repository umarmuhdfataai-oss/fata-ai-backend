<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fata AI Core - Powered by Gemini</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #131314;
            color: #e3e3e3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .gemini-gradient-text {
            background: linear-gradient(74deg, #4285f4 0%, #9b51e0 35%, #e91e63 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar { background-color: #1e1f20; }
        .user-msg {
            background-color: #282a2c;
            color: #e3e3e3;
            border-radius: 18px 18px 4px 18px;
        }
        .ai-msg {
            background-color: #1e1f20;
            color: #e3e3e3;
            border-radius: 18px 18px 18px 4px;
            border: 1px solid #282a2c;
        }
        .custom-input {
            background-color: #1e1f20;
            border: 1px solid #3c4043;
        }
        .custom-input:focus {
            border-color: #a8c7fa;
            outline: none;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #131314; }
        ::-webkit-scrollbar-thumb {
            background: #282a2c;
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar w-full md:w-80 flex flex-col justify-between p-4 border-r border-[#282a2c]">
        <div>
            <!-- Logo & Title -->
            <div class="flex items-center space-x-3 mb-6 px-2">
                <div class="w-10 h-10 rounded-full flex items-center justify-center bg-gradient-to-tr from-blue-600 via-purple-600 to-pink-500 text-white font-bold text-xl shadow-lg">
                    F
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide gemini-gradient-text">Fata AI Ultra Core</h1>
                    <p class="text-xs text-gray-400">Backend Status: <span id="backendStatus" class="text-yellow-400 font-semibold">Checking...</span></p>
                </div>
            </div>

            <!-- New Chat Button -->
            <button onclick="startNewSession()" class="w-full flex items-center justify-center space-x-2 py-3 px-4 rounded-full bg-[#282a2c] hover:bg-[#37393b] transition duration-200 text-sm font-medium mb-6 border border-[#3c4043]">
                <i class="fa-solid fa-plus text-blue-400"></i>
                <span>Sabuwar Tattaunawa</span>
            </button>

            <!-- Active Token / Session Info -->
            <div class="bg-[#131314] p-3 rounded-2xl border border-[#282a2c] mb-4">
                <label class="text-xs font-semibold text-gray-400 block mb-1">Session ID</label>
                <input type="text" id="sessionIdDisplay" readonly class="w-full bg-transparent text-xs text-gray-300 focus:outline-none truncate" value="Generating...">
            </div>
        </div>

        <!-- AI Workspaces -->
        <div class="border-t border-[#282a2c] pt-4">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">AI Workspaces</h2>
            <div class="space-y-2">
                <div class="flex items-center space-x-3 p-2 rounded-xl bg-[#282a2c] cursor-pointer hover:bg-[#37393b] transition">
                    <i class="fa-solid fa-comments text-blue-400"></i>
                    <span class="text-sm font-medium">Interactive AI Chat</span>
                </div>
                <div class="flex items-center space-x-3 p-2 rounded-xl hover:bg-[#282a2c] text-gray-400 cursor-pointer transition">
                    <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i>
                    <span class="text-sm font-medium">Image Generation</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CHAT CANVAS -->
    <main class="flex-1 flex flex-col justify-between h-full relative">
        
        <!-- TOP HEADER -->
        <header class="h-16 border-b border-[#282a2c] flex items-center justify-between px-6 bg-[#131314]/80 backdrop-blur">
            <div class="flex items-center space-x-2">
                <span class="text-sm font-semibold text-gray-300">Gemini Engine</span>
                <span class="px-2 py-0.5 text-[10px] bg-blue-500/10 text-blue-400 rounded-full border border-blue-500/20">Live</span>
            </div>
            <div class="text-xs text-gray-400">
                <i class="fa-solid fa-shield-halved text-green-400 mr-1"></i> Fast Stream Secured
            </div>
        </header>

        <!-- CHAT MESSAGES DISPLAY AREA -->
        <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
            <!-- Greeting Message -->
            <div class="flex items-start space-x-3 ai-msg p-4 max-w-2xl">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-xs font-bold shrink-0">
                    AI
                </div>
                <div>
                    <p class="text-sm leading-relaxed">Barka da zuwa! Ni ne **Fata AI**. Yaya zan iya taimaka maka a yau?</p>
                </div>
            </div>
        </div>

        <!-- CHAT INPUT AREA -->
        <div class="p-4 md:p-6 bg-[#131314]">
            <div class="max-w-4xl mx-auto">
                <form id="chatForm" onsubmit="handleSend(event)" class="relative flex items-center">
                    <textarea id="messageInput" rows="1" placeholder="Rubuta saƙo zuwa Fata AI..." 
                        class="w-full custom-input text-sm text-gray-200 rounded-2xl py-4 pl-5 pr-14 resize-none shadow-inner transition"
                        onkeydown="if(event.key === 'Enter' && !event.shiftKey){ event.preventDefault(); handleSend(event); }"></textarea>
                    
                    <button type="submit" id="sendBtn" class="absolute right-3 w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center transition duration-200 shadow-md">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
                <p class="text-[11px] text-gray-500 text-center mt-2">
                    Fata AI Ultra Core yana amfani da sabbin damar Gemini LLM.
                </p>
            </div>
        </div>
    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const API_BASE_URL = "https://fata-ai-backend-9zxv.onrender.com";
        let currentSessionId = "session_" + Math.random().toString(36).substring(2, 11);
        let userAuthToken = "";

        document.getElementById("sessionIdDisplay").value = currentSessionId;

        // Automatically authenticate guest user on load
        async function initializeAuth() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/v2/auth/guest`, { method: "POST" });
                if (res.ok) {
                    const data = await res.json();
                    userAuthToken = data.access_token;
                    document.getElementById("backendStatus").innerText = "Online";
                    document.getElementById("backendStatus").className = "text-green-400 font-semibold";
                    return true;
                } else {
                    document.getElementById("backendStatus").innerText = "Offline";
                    document.getElementById("backendStatus").className = "text-red-400 font-semibold";
                    return false;
                }
            } catch (err) {
                document.getElementById("backendStatus").innerText = "Error";
                document.getElementById("backendStatus").className = "text-red-400 font-semibold";
                console.error(err);
                return false;
            }
        }

        function startNewSession() {
            currentSessionId = "session_" + Math.random().toString(36).substring(2, 11);
            document.getElementById("sessionIdDisplay").value = currentSessionId;
            document.getElementById("chatBox").innerHTML = `
                <div class="flex items-start space-x-3 ai-msg p-4 max-w-2xl">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-xs font-bold shrink-0">
                        AI
                    </div>
                    <div>
                        <p class="text-sm leading-relaxed">Sabuwar tattaunawa ta faru! Yaya zan iya taimaka maka?</p>
                    </div>
                </div>
            `;
        }

        async function handleSend(e) {
            e.preventDefault();
            const inputField = document.getElementById("messageInput");
            const userMsg = inputField.value.trim();
            if (!userMsg) return;

            // Idan babu token, nema yanzu kafin aikawa
            if (!userAuthToken) {
                const authed = await initializeAuth();
                if (!authed) {
                    alert("Akwai matsalar haɗawa da Backend!");
                    return;
                }
            }

            inputField.value = "";
            const chatBox = document.getElementById("chatBox");

            // 1. Render User Message
            const userDiv = document.createElement("div");
            userDiv.className = "flex justify-end mb-4";
            userDiv.innerHTML = `
                <div class="user-msg p-4 max-w-xl text-sm leading-relaxed shadow">
                    ${escapeHtml(userMsg)}
                </div>
            `;
            chatBox.appendChild(userDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Render AI Empty Bubble
            const aiDiv = document.createElement("div");
            aiDiv.className = "flex items-start space-x-3 ai-msg p-4 max-w-2xl mb-4";
            aiDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-xs font-bold shrink-0">
                    AI
                </div>
                <div class="text-sm leading-relaxed whitespace-pre-wrap" id="aiResponseContainer">
                    <span class="animate-pulse text-gray-400">Yana tunani...</span>
                </div>
            `;
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            const aiTextElement = aiDiv.querySelector("#aiResponseContainer");

            try {
                let response = await fetch(`${API_BASE_URL}/api/v2/chat/stream`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${userAuthToken}`
                    },
                    body: JSON.stringify({
                        message: userMsg,
                        session_id: currentSessionId
                    })
                });

                // Idan token ya mutu (401), sake sabunta shi kuma a sake aikawa
                if (response.status === 401) {
                    const refreshed = await initializeAuth();
                    if (refreshed) {
                        response = await fetch(`${API_BASE_URL}/api/v2/chat/stream`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${userAuthToken}`
                            },
                            body: JSON.stringify({
                                message: userMsg,
                                session_id: currentSessionId
                            })
                        });
                    }
                }

                if (!response.ok) {
                    aiTextElement.innerHTML = `<span class="text-red-400">⚠️ Kuskure daga Backend (${response.status} ${response.statusText})</span>`;
                    return;
                }

                // Stream response reading
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                aiTextElement.innerHTML = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    aiTextElement.innerText += chunk;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }

            } catch (err) {
                aiTextElement.innerHTML = `<span class="text-red-400">⚠️ An samu matsalar haɗi: ${err.message}</span>`;
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initialize system on page load
        initializeAuth();
    </script>
</body>
</html>
