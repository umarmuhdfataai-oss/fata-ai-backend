<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fata AI - Ultra Core Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e1e24; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#0f0f11] text-gray-100 h-screen flex overflow-hidden">

    <!-- BACKEND CONFIGURATION -->
    <script>
        const API_BASE_URL = "https://fata-ai-backend-9zxv.onrender.com";
        let currentUser = null;
        let token = localStorage.getItem("fata_token") || null;
        let currentChatId = null;
    </script>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-[#18181b] border-r border-zinc-800 flex flex-col justify-between transition-all duration-300 md:relative absolute z-30 h-full -translate-x-full md:translate-x-0">
        <div>
            <!-- App Header -->
            <div class="p-4 flex justify-between items-center border-b border-zinc-800">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg">F</div>
                    <span class="font-bold text-lg tracking-wide text-white">Fata AI <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/30">Ultra</span></span>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- New Chat Button -->
            <div class="p-3">
                <button onclick="startNewChat()" class="w-full py-2.5 px-4 bg-zinc-800 hover:bg-zinc-700 border border-zinc-700/50 rounded-xl flex items-center gap-3 text-sm font-medium transition text-gray-200 shadow-sm">
                    <i class="fa-solid fa-plus text-indigo-400"></i> Sabuwar Tattaunawa
                </button>
            </div>

            <!-- History Search -->
            <div class="px-3 pb-2">
                <button onclick="openSearchModal()" class="w-full py-1.5 px-3 bg-zinc-900/60 border border-zinc-800 rounded-lg text-xs text-gray-400 flex items-center justify-between hover:border-zinc-700">
                    <span class="flex items-center gap-2"><i class="fa-solid fa-magnifying-glass"></i> Bincika tarihin...</span>
                    <kbd class="px-1.5 py-0.5 text-[10px] bg-zinc-800 border border-zinc-700 rounded text-gray-400">Ctrl K</kbd>
                </button>
            </div>

            <!-- Chat History List -->
            <div class="px-3 py-2">
                <p class="text-[11px] font-semibold text-gray-500 tracking-wider uppercase px-2 mb-2">Tarihin Tattaunawa</p>
                <div id="historyList" class="space-y-1 overflow-y-auto max-h-[calc(100vh-280px)] custom-scrollbar pr-1">
                    <!-- History items injected here -->
                </div>
            </div>
        </div>

        <!-- User Profile Section -->
        <div id="userProfileArea" class="p-3 border-t border-zinc-800 bg-[#141417]">
            <!-- Injected dynamically via JavaScript -->
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full bg-[#0f0f11] relative">
        <!-- Top Navbar -->
        <header class="h-14 border-b border-zinc-800/80 flex items-center justify-between px-4 bg-[#0f0f11]/80 backdrop-blur-md z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white p-2">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <span id="currentChatTitle" class="font-medium text-sm text-gray-300 truncate max-w-[200px] md:max-w-md">Tattaunawa Sabuwa</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <span class="text-xs text-emerald-400 font-medium">Gemini Online</span>
            </div>
        </header>

        <!-- Messages Container -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 custom-scrollbar">
            <!-- Welcome Hero Screen -->
            <div id="welcomeScreen" class="max-w-2xl mx-auto my-12 text-center space-y-4">
                <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-purple-600 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold shadow-xl shadow-indigo-500/10">
                    F
                </div>
                <h1 class="text-2xl md:text-3xl font-bold text-white">Sannu da zuwa Fata AI</h1>
                <p class="text-gray-400 text-sm max-w-md mx-auto">Injin ku na AI mai sauri da basira. Tambayi kowace irin tambaya, ko neman shawara.</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-4 text-left">
                    <button onclick="usePrompt('Yi min bayani game da FastAPI da MongoDB')" class="p-3 bg-zinc-900 border border-zinc-800 rounded-xl hover:border-indigo-500/50 transition text-xs text-gray-300">
                        <i class="fa-solid fa-code text-indigo-400 mb-2 block"></i>
                        <span class="font-semibold block text-white">Bayani akan Code</span>
                        Yi min bayani game da FastAPI...
                    </button>
                    <button onclick="usePrompt('Rubuta min shawarwari 5 na inganta kasuwanci')" class="p-3 bg-zinc-900 border border-zinc-800 rounded-xl hover:border-indigo-500/50 transition text-xs text-gray-300">
                        <i class="fa-solid fa-lightbulb text-amber-400 mb-2 block"></i>
                        <span class="font-semibold block text-white">Shawarwari</span>
                        Rubuta min shawarwari 5 na...
                    </button>
                </div>
            </div>
        </div>

        <!-- Prompt Input Bar -->
        <div class="p-3 md:p-4 border-t border-zinc-800/80 bg-[#0f0f11]">
            <div class="max-w-3xl mx-auto relative bg-[#18181b] border border-zinc-700/60 rounded-2xl focus-within:border-indigo-500 transition shadow-lg">
                <textarea id="promptInput" rows="1" placeholder="Rubuta tambayarku anan..." class="w-full bg-transparent px-4 py-3 pr-12 text-sm text-gray-100 focus:outline-none resize-none max-h-32 custom-scrollbar"></textarea>
                <button id="sendBtn" onclick="sendMessage()" class="absolute right-2 bottom-2 w-8 h-8 bg-indigo-600 hover:bg-indigo-500 rounded-xl flex items-center justify-center text-white transition disabled:opacity-50">
                    <i class="fa-solid fa-arrow-up text-sm"></i>
                </button>
            </div>
            <p class="text-[10px] text-center text-gray-500 mt-2">Fata AI Ultra Core Engine wani tsari ne mai amfani da basirar Gemini AI.</p>
        </div>
    </main>

    <!-- AUTH MODAL (LOGIN / REGISTER) -->
    <div id="authModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-[#18181b] border border-zinc-800 p-6 rounded-2xl w-full max-w-md relative shadow-2xl">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <!-- Auth Tabs -->
            <div class="flex gap-4 border-b border-zinc-800 mb-6">
                <button id="tabLogin" onclick="switchAuthTab('login')" class="pb-2 text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500">Shiga (Login)</button>
                <button id="tabRegister" onclick="switchAuthTab('register')" class="pb-2 text-sm font-semibold text-gray-400">Rijista (Register)</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Email</label>
                    <input type="email" id="loginEmail" required class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-medium text-white transition shadow-lg shadow-indigo-600/20">Shiga Tattaunawa</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Suna (Full Name)</label>
                    <input type="text" id="regName" required class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Email</label>
                    <input type="email" id="regEmail" required class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Password</label>
                    <input type="password" id="regPassword" required class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 rounded-xl text-sm font-medium text-white transition shadow-lg shadow-purple-600/20">Ajiye Rijista</button>
            </form>
        </div>
    </div>

    <!-- SEARCH MODAL -->
    <div id="searchModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-start justify-center pt-20 hidden">
        <div class="bg-[#18181b] border border-zinc-800 p-4 rounded-2xl w-full max-w-lg relative shadow-2xl">
            <div class="flex items-center gap-3 border-b border-zinc-800 pb-3">
                <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                <input type="text" id="searchInput" oninput="filterChatsHistory()" placeholder="Bincika cikin tarihin tattaunawa..." class="w-full bg-transparent text-sm text-white focus:outline-none">
                <button onclick="closeSearchModal()" class="text-xs bg-zinc-800 text-gray-400 px-2 py-1 rounded">ESC</button>
            </div>
            <div id="searchResults" class="mt-3 max-h-60 overflow-y-auto space-y-2 custom-scrollbar">
                <!-- Dynamic Search Results -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let chatHistory = [];

        // Auto Resize Textarea
        const promptInput = document.getElementById("promptInput");
        promptInput.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        });

        // Toggle Sidebar
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("-translate-x-full");
        }

        // Open/Close Auth Modal
        function openAuthModal() { document.getElementById("authModal").classList.remove("hidden"); }
        function closeAuthModal() { document.getElementById("authModal").classList.add("hidden"); }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const regForm = document.getElementById("registerForm");
            const tabLogin = document.getElementById("tabLogin");
            const tabRegister = document.getElementById("tabRegister");

            if (tab === 'login') {
                loginForm.classList.remove("hidden");
                regForm.classList.add("hidden");
                tabLogin.className = "pb-2 text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500";
                tabRegister.className = "pb-2 text-sm font-semibold text-gray-400";
            } else {
                loginForm.classList.add("hidden");
                regForm.classList.remove("hidden");
                tabRegister.className = "pb-2 text-sm font-semibold text-purple-400 border-b-2 border-purple-500";
                tabLogin.className = "pb-2 text-sm font-semibold text-gray-400";
            }
        }

        // Auth Logic
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    token = data.access_token;
                    localStorage.setItem("fata_token", token);
                    closeAuthModal();
                    initializeAuth();
                } else {
                    alert(data.detail || "An samu matsala wajen shiga.");
                }
            } catch (err) {
                console.error(err);
                alert("Akwai matsala wajen haɗawa da uwar garke (Server).");
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById("regName").value;
            const email = document.getElementById("regEmail").value;
            const password = document.getElementById("regPassword").value;

            try {
                const res = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ full_name: name, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("Rijista ta kammala! Shiga yanzu.");
                    switchAuthTab("login");
                } else {
                    alert(data.detail || "Rijista ba ta yi nasara ba.");
                }
            } catch (err) {
                console.error(err);
                alert("Akwai matsala wajen haɗawa da uwar garke (Server).");
            }
        }

        function logout() {
            localStorage.removeItem("fata_token");
            token = null;
            currentUser = null;
            currentChatId = null;
            initializeAuth();
        }

        // Initialize User Info
        async function initializeAuth() {
            const profileArea = document.getElementById("userProfileArea");
            if (token) {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/users/me`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (res.ok) {
                        currentUser = await res.json();
                        profileArea.innerHTML = `
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold text-white">
                                        ${currentUser.full_name ? currentUser.full_name[0].toUpperCase() : 'U'}
                                    </div>
                                    <div class="truncate max-w-[120px]">
                                        <p class="text-xs font-medium text-gray-200 truncate">${currentUser.full_name || 'Mai amfani'}</p>
                                        <p class="text-[10px] text-gray-500 truncate">${currentUser.email}</p>
                                    </div>
                                </div>
                                <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-xs p-1" title="Saukawa">
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                </button>
                            </div>
                        `;
                        fetchChatHistory();
                        return;
                    }
                } catch (e) { console.error(e); }
            }

            // Default logged-out view
            profileArea.innerHTML = `
                <button onclick="openAuthModal()" class="w-full py-2 px-3 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 rounded-xl text-xs font-medium flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-user"></i> Shiga ko Yi Rijista
                </button>
            `;
        }

        // Chat Operations
        function usePrompt(text) {
            document.getElementById("promptInput").value = text;
            sendMessage();
        }

        function startNewChat() {
            currentChatId = null;
            document.getElementById("messagesContainer").innerHTML = `
                <div id="welcomeScreen" class="max-w-2xl mx-auto my-12 text-center space-y-4">
                    <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-purple-600 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold shadow-xl shadow-indigo-500/10">F</div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white">Sannu da zuwa Fata AI</h1>
                    <p class="text-gray-400 text-sm max-w-md mx-auto">Injin ku na AI mai sauri da basira. Tambayi kowace irin tambaya, ko neman shawara.</p>
                </div>
            `;
            document.getElementById("currentChatTitle").innerText = "Tattaunawa Sabuwa";
        }

        async function fetchChatHistory() {
            if (!token) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/chats`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (res.ok) {
                    chatHistory = await res.json();
                    renderHistory();
                }
            } catch (err) { console.error(err); }
        }

        function renderHistory() {
            const list = document.getElementById("historyList");
            list.innerHTML = "";
            chatHistory.forEach(chat => {
                const item = document.createElement("div");
                item.className = `group flex items-center justify-between p-2 rounded-lg text-xs cursor-pointer transition ${currentChatId === chat.id ? 'bg-zinc-800 text-white' : 'text-gray-400 hover:bg-zinc-900 hover:text-gray-200'}`;
                item.onclick = () => loadChatSession(chat.id);
                item.innerHTML = `
                    <div class="flex items-center gap-2 truncate flex-1">
                        <i class="fa-regular fa-message text-[10px]"></i>
                        <span class="truncate">${escapeHtml(chat.title || 'Tattaunawa')}</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        async function loadChatSession(chatId) {
            currentChatId = chatId;
            renderHistory();
            try {
                const res = await fetch(`${API_BASE_URL}/api/chats/${chatId}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById("currentChatTitle").innerText = data.title || "Tattaunawa";
                    const container = document.getElementById("messagesContainer");
                    container.innerHTML = "";
                    data.messages.forEach(msg => {
                        appendMessage(msg.role, msg.content);
                    });
                }
            } catch (err) { console.error(err); }
        }

        async function sendMessage() {
            const input = document.getElementById("promptInput");
            const text = input.value.trim();
            if (!text) return;

            // Clear input & remove welcome screen
            input.value = "";
            input.style.height = "auto";
            const welcomeScreen = document.getElementById("welcomeScreen");
            if (welcomeScreen) welcomeScreen.remove();

            // Render User Message
            appendMessage("user", text);

            // Render Temporary AI Loading Shell
            const aiMessageId = appendMessage("assistant", `<i class="fa-solid fa-spinner fa-spin text-indigo-400"></i> Ina tunani...`);

            try {
                const res = await fetch(`${API_BASE_URL}/api/chat/generate`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        ...(token ? { "Authorization": `Bearer ${token}` } : {})
                    },
                    body: JSON.stringify({
                        prompt: text,
                        chat_id: currentChatId
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    updateMessage(aiMessageId, data.response);
                    if (data.chat_id) currentChatId = data.chat_id;
                    fetchChatHistory();
                } else {
                    updateMessage(aiMessageId, `⚠️ Kuskure: ${data.detail || 'An samu matsala.'}`);
                }
            } catch (err) {
                console.error(err);
                updateMessage(aiMessageId, "⚠️ An samu kuskure wajen haɗawa da Fata AI Engine.");
            }
        }

        function appendMessage(role, content) {
            const container = document.getElementById("messagesContainer");
            const msgId = "msg-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4);
            const isUser = role === "user";

            const div = document.createElement("div");
            div.id = msgId;
            div.className = `flex gap-3 max-w-3xl mx-auto ${isUser ? 'justify-end' : 'justify-start'}`;

            div.innerHTML = `
                <div class="flex gap-3 max-w-[85%] ${isUser ? 'flex-row-reverse' : 'flex-row'}">
                    <div class="w-7 h-7 rounded-lg shrink-0 flex items-center justify-center text-xs font-bold ${isUser ? 'bg-indigo-600 text-white' : 'bg-gradient-to-tr from-purple-600 to-indigo-600 text-white'}">
                        ${isUser ? 'K' : 'F'}
                    </div>
                    <div class="space-y-2">
                        <div class="p-3.5 rounded-2xl text-sm ${isUser ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-[#18181b] border border-zinc-800 text-gray-200 rounded-tl-none'} shadow-sm ai-content">
                            ${isUser ? escapeHtml(content) : marked.parse(content)}
                        </div>
                        ${!isUser ? `
                            <div class="flex items-center gap-2 text-[11px] text-gray-500 px-1">
                                <button onclick="copyToClipboard(this)" class="hover:text-gray-300 transition flex items-center gap-1">
                                    <i class="fa-regular fa-copy"></i> Kwafa
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            hljs.highlightAll();
            return msgId;
        }

        function updateMessage(msgId, newContent) {
            const msgDiv = document.getElementById(msgId);
            if (msgDiv) {
                const contentDiv = msgDiv.querySelector('.ai-content');
                contentDiv.innerHTML = marked.parse(newContent);
                hljs.highlightAll();
            }
        }

        // Search Modal Functions
        function openSearchModal() { document.getElementById("searchModal").classList.remove("hidden"); }
        function closeSearchModal() { document.getElementById("searchModal").classList.add("hidden"); }

        function filterChatsHistory() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const resultsList = document.getElementById("searchResults");
            resultsList.innerHTML = "";

            const filtered = chatHistory.filter(c => (c.title || '').toLowerCase().includes(query));
            filtered.forEach(item => {
                const div = document.createElement("div");
                div.className = "p-3 rounded-xl bg-[#131314] hover:bg-[#282a2c] cursor-pointer transition text-xs text-gray-200 flex justify-between items-center";
                div.onclick = () => {
                    loadChatSession(item.id);
                    closeSearchModal();
                };
                div.innerHTML = `
                    <span class="truncate flex-1">${escapeHtml(item.title)}</span>
                    <i class="fa-solid fa-chevron-right text-gray-500 text-[10px]"></i>
                `;
                resultsList.appendChild(div);
            });

            if (filtered.length === 0) {
                resultsList.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">Babu tattaunawar da ta dace.</p>`;
            }
        }

        function copyToClipboard(button) {
            const content = button.closest('.space-y-2').querySelector('.ai-content').innerText;
            navigator.clipboard.writeText(content).then(() => {
                const originalIcon = button.innerHTML;
                button.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> An Kwafa`;
                setTimeout(() => { button.innerHTML = originalIcon; }, 2000);
            });
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize App
        window.addEventListener("DOMContentLoaded", () => {
            initializeAuth();
            renderHistory();
        });
    </script>
