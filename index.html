<!DOCTYPE html>
<html lang="ha" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fata AI - Super Intelligence Platform 2026</title>
    
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts & Markdown Parser -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-main: #090d16;
            --sidebar-bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: rgba(255, 255, 255, 0.08);
            --user-bubble: linear-gradient(135deg, #2563eb, #1d4ed8);
            --ai-bubble: #1e293b;
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .brand-logo {
            padding: 20px;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 10px;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s ease;
            font-size: 0.9rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .nav-btn.active {
            border-left: 3px solid var(--accent-color);
        }

        /* Main Workspace */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* Header Navigation */
        .app-header {
            padding: 12px 24px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Mode Tabs */
        .mode-tabs .btn {
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
        }

        .mode-tabs .btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Chat Workspace */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            gap: 12px;
            max-width: 82%;
        }

        .message-row.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .user .avatar {
            background: var(--accent-color);
        }

        .ai .avatar {
            background: linear-gradient(135deg, #a855f7, #ec4899);
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .user .message-bubble {
            background: var(--user-bubble);
            color: #fff;
            border-top-right-radius: 2px;
        }

        .ai .message-bubble {
            background: var(--ai-bubble);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            border-top-left-radius: 2px;
        }

        .message-bubble pre {
            background: #090d16;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 8px;
        }

        .message-bubble img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid var(--card-border);
        }

        /* Action Toolbar on AI Messages */
        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 2px 8px;
            border-radius: 6px;
            transition: 0.2s ease;
        }

        .action-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Bottom Input Bar */
        .input-bar-wrapper {
            padding: 16px 24px;
            background: var(--sidebar-bg);
            border-top: 1px solid var(--card-border);
        }

        .input-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .input-box textarea {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 100%;
            resize: none;
            outline: none;
            height: 24px;
            max-height: 120px;
            font-size: 0.95rem;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .send-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 12px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #sidebar {
                position: absolute;
                left: -280px;
                height: 100%;
            }
            #sidebar.open {
                left: 0;
            }
            .message-row {
                max-width: 92%;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Bar -->
    <aside id="sidebar">
        <div class="brand-logo d-flex align-items-center gap-2">
            <i class="bi bi-cpu-fill text-primary"></i>
            <span>FATA AI ULTRA</span>
        </div>
        
        <div class="p-3">
            <button class="btn btn-primary w-100 rounded-pill d-flex align-items-center justify-content-center gap-2 fw-semibold" onclick="createNewChat()">
                <i class="bi bi-plus-lg"></i> Sabon Tattaunawa
            </button>
        </div>

        <div class="px-2 flex-grow-1 overflow-y-auto">
            <small class="px-3 text-uppercase text-muted fw-bold" style="font-size: 0.7rem;">Tarihin Chat</small>
            <div class="mt-2 d-flex flex-column gap-1" id="chatHistoryList">
                <button class="nav-btn active">
                    <i class="bi bi-chat-left-text"></i>
                    <span class="text-truncate">Binciken Llama 3.3 Engine</span>
                </button>
            </div>
        </div>

        <div class="p-3 border-top border-secondary">
            <button class="nav-btn" onclick="clearChat()">
                <i class="bi bi-trash3 text-danger"></i>
                <span class="text-danger">Goge Tattaunawa</span>
            </button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="main-wrapper">
        <!-- Top App Header -->
        <header class="app-header">
            <div class="d-flex align-items-center gap-3">
                <button class="icon-btn d-md-none" onclick="toggleSidebar()">
                    <i class="bi bi-list"></i>
                </button>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-2">
                    <i class="bi bi-lightning-charge-fill me-1"></i> Fata Engine v2026
                </span>
            </div>

            <!-- Mode Tabs -->
            <div class="mode-tabs d-flex gap-2">
                <button class="btn active" onclick="switchMode('chat', this)">
                    <i class="bi bi-chat-dots me-1"></i> Chat
                </button>
                <button class="btn" onclick="switchMode('image', this)">
                    <i class="bi bi-palette me-1"></i> Flux Image
                </button>
                <button class="btn" onclick="switchMode('pdf', this)">
                    <i class="bi bi-file-earmark-pdf me-1"></i> PDF Vision
                </button>
            </div>
        </header>

        <!-- Dynamic Chat Message Window -->
        <div class="chat-container" id="chatContainer">
            <!-- Welcome AI Message -->
            <div class="message-row ai">
                <div class="avatar"><i class="bi bi-robot"></i></div>
                <div class="message-bubble">
                    <div><strong>Barka da zuwa Fata AI 2026!</strong></div>
                    Ni ne mataimakin basira na Fata AI. Zan iya amsa kowace tambaya, zana maka hotuna masu inganci da <strong>Flux Engine</strong>, gudanar da bincike a Intanet, ko sarrafa fayiloli da sauti.
                    <div class="message-actions">
                        <button class="action-btn" onclick="copyText(this)"><i class="bi bi-copy"></i> Kwakwafa</button>
                        <button class="action-btn" onclick="shareResponse()"><i class="bi bi-share"></i> Raba</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Control Panel -->
        <div class="input-bar-wrapper">
            <div id="filePreview" class="mb-2 text-info small d-none align-items-center gap-2">
                <i class="bi bi-paperclip"></i> <span id="fileName"></span>
                <i class="bi bi-x-circle text-danger cursor-pointer" onclick="removeFile()"></i>
            </div>

            <form id="chatForm" onsubmit="handleFormSubmit(event)">
                <div class="input-box">
                    <input type="file" id="fileInput" class="d-none" accept="image/*,.pdf,.txt" onchange="previewFile()">
                    
                    <button type="button" class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Haɗa Fayil ko Hoto">
                        <i class="bi bi-paperclip"></i>
                    </button>

                    <textarea id="userInput" placeholder="Rubuta saƙo ko bukatar hotonku..." rows="1" onkeydown="handleKeyPress(event)"></textarea>

                    <button type="button" class="icon-btn" id="micBtn" onclick="toggleRecording()" title="Aika Muryarka">
                        <i class="bi bi-mic-fill text-warning"></i>
                    </button>

                    <button type="submit" class="send-btn" id="sendBtn" title="Aika">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const BASE_URL = "https://fata-ai-backend-9zxv.onrender.com";
        let selectedFile = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function switchMode(mode, btn) {
            document.querySelectorAll('.mode-tabs .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const input = document.getElementById('userInput');
            if (mode === 'image') {
                input.placeholder = "Saka bayanin hoton da kake son zana mawa (mishali: 'Zana hoton agogo mai kyau')...";
            } else if (mode === 'pdf') {
                input.placeholder = "Haɗa PDF ɗinka ta hanyar amfani da maballin haɗawa...";
            } else {
                input.placeholder = "Rubuta saƙo ko bukatar hotonku...";
            }
        }

        function previewFile() {
            const input = document.getElementById('fileInput');
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                document.getElementById('fileName').innerText = selectedFile.name;
                document.getElementById('filePreview').classList.remove('d-none');
                document.getElementById('filePreview').classList.add('d-flex');
            }
        }

        function removeFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('filePreview').classList.add('d-none');
            document.getElementById('filePreview').classList.remove('d-flex');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleFormSubmit(e);
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message && !selectedFile) return;

            appendUserMessage(message || selectedFile.name);
            input.value = '';

            await streamAIChatResponse(message);
            removeFile();
        }

        function appendUserMessage(text) {
            const container = document.getElementById('chatContainer');
            const html = `
                <div class="message-row user">
                    <div class="avatar"><i class="bi bi-person-fill"></i></div>
                    <div class="message-bubble">${text}</div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            container.scrollTop = container.scrollHeight;
        }

        async function streamAIChatResponse(message) {
            const container = document.getElementById('chatContainer');
            const aiRowId = 'ai-msg-' + Date.now();
            
            const aiHtml = `
                <div class="message-row ai" id="${aiRowId}">
                    <div class="avatar"><i class="bi bi-robot"></i></div>
                    <div class="message-bubble">
                        <div class="content"><em>Fata AI tana tunani...</em></div>
                        <div class="message-actions d-none">
                            <button class="action-btn" onclick="copyText(this)"><i class="bi bi-copy"></i> Kwakwafa</button>
                            <button class="action-btn" onclick="readVoice(this)"><i class="bi bi-volume-up"></i> Karanta</button>
                            <button class="action-btn" onclick="shareResponse()"><i class="bi bi-share"></i> Raba</button>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', aiHtml);
            container.scrollTop = container.scrollHeight;

            const aiRow = document.getElementById(aiRowId);
            const contentDiv = aiRow.querySelector('.content');
            const actionsDiv = aiRow.querySelector('.message-actions');

            const formData = new FormData();
            formData.append('message', message);
            if (selectedFile) formData.append('file', selectedFile);

            let fullText = '';

            try {
                const response = await fetch(`${BASE_URL}/chat/stream`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    contentDiv.innerHTML = `<span class="text-danger">⚠️ Matsala wajen haɗawa da Server (${response.status})</span>`;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                contentDiv.innerHTML = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.replace('data: ', '').trim();
                            if (dataStr === '[DONE]') break;

                            try {
                                const parsed = JSON.parse(dataStr);
                                if (parsed.content) {
                                    fullText += parsed.content;
                                    contentDiv.innerHTML = marked.parse(fullText);
                                    container.scrollTop = container.scrollHeight;
                                }
                            } catch (err) {}
                        }
                    }
                }

                actionsDiv.classList.remove('d-none');

            } catch (error) {
                contentDiv.innerHTML = `<span class="text-danger">⚠️ Kuskuren sadarwa da Yanar Gizo.</span>`;
            }
        }

        // Functional Utilities
        function copyText(btn) {
            const bubble = btn.closest('.message-bubble');
            const text = bubble.querySelector('.content').innerText;
            navigator.clipboard.writeText(text);
            btn.innerHTML = `<i class="bi bi-check2 text-success"></i> An Kwakwafa`;
            setTimeout(() => btn.innerHTML = `<i class="bi bi-copy"></i> Kwakwafa`, 2000);
        }

        async function readVoice(btn) {
            const bubble = btn.closest('.message-bubble');
            const text = bubble.querySelector('.content').innerText;
            
            btn.innerHTML = `<i class="bi bi-hourglass-split"></i> Sauti...`;
            const formData = new FormData();
            formData.append('text', text.substring(0, 300));
            formData.append('lang', 'ha');

            try {
                const res = await fetch(`${BASE_URL}/chat/text-to-speech`, { method: 'POST', body: formData });
                if (res.ok) {
                    const blob = await res.blob();
                    const audio = new Audio(URL.createObjectURL(blob));
                    audio.play();
                }
            } catch (e) {
                console.log("TTS Error:", e);
            } finally {
                btn.innerHTML = `<i class="bi bi-volume-up"></i> Karanta`;
            }
        }

        function shareResponse() {
            if (navigator.share) {
                navigator.share({ title: 'Fata AI Response', text: 'Dubi amsar da Fata AI ta bani!' });
            } else {
                alert("An kwakwafi hanyar raba amsar!");
            }
        }

        function clearChat() {
            if (confirm("Shin kana son goge dukkan tattaunawar yanzu?")) {
                document.getElementById('chatContainer').innerHTML = '';
            }
        }

        function createNewChat() {
            clearChat();
        }
    </script>
</body>
</html>
